name: ci
# The glue's checks (its own Cargo workspace in glue/) and the page built from it, on every push and pull request
on:
  push:
  pull_request:
jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: cargo fmt --check
        working-directory: glue
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: glue
      - run: cargo test --locked
        working-directory: glue
      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page
          path: dist
