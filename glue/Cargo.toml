[package]
name = "iridia-web"
description = "The wasm glue of the iridia + dx page: reads, lifts, analyses and runs a dropped shader for the page"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/iridia-dx-web"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
d3d9-reader = "0.8.0"
dxbc-reader = "0.8.0"
dxcontainer = "0.8.0"
dxil-reader = "0.8.0"
# iridia's crates from one commit of its main branch: move the rev of all of them together
iridia = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-d3d9-ir = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-dxbc = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-dxil = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-exec = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-exec-ir = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-ir = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
iridia-naga = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8", default-features = false, features = ["wgsl"] }
iridia-passes = { git = "https://github.com/Kalmarv/iridia", rev = "8bdbc7c7a572c613fc18fded07c22e2dd40909c8" }
naga = { version = "30.0.1", package = "primase-naga", default-features = false, features = ["wgsl-out"] }
# iridia-naga lowers the IR to naga as published; the naga path above uses the fork
stock-naga = { version = "=30.0.1", package = "naga", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "0.2"

[dev-dependencies]
# the tests read written WGSL back, to check what a pair links
stock-naga = { version = "=30.0.1", package = "naga", default-features = false, features = ["wgsl-in"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
